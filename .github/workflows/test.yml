name: test

on:
  push:
    branches:
      - main
    paths:
      - 'Quartus/**'
      - 'RTL/**'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Quartus/**'
      - 'RTL/**'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_call:
jobs:
  testing:
    runs-on: ubuntu-latest
    container:
      image: mbtaylor1982/cocotb-iverilog@sha256:b62699a09a7e76ff80cf69932f222395886d661247f63b6a82285df22804cca6
      credentials:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_PWD }}
    steps:
      # 1 - Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4     
      - name: Run directed RTL and packaging tests
        run: timeout 180s pytest RTL/cocotb tools -q --junitxml=sim_build/test-results.xml
      # 4 Upload VCD Files
      - name: upload vcd files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcd-files
          path: sim_build/**
          retention-days: 14


